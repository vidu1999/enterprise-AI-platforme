name: OpsPilot CI/CD

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API Build, Migrations & Integration Tests (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_dev_password
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opspilot -d opspilot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_DRIVER: pg
      USE_EXTERNAL_PG: "true"
      DATABASE_URL: postgresql://opspilot:opspilot_dev_password@localhost:5432/opspilot
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-32-chars-long-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:migrate --workspace=apps/api
      - run: npm run build --workspace=apps/api
      - run: npm test --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api

  web:
    name: Next.js Production Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=apps/web

  ai:
    name: FastAPI AI Service & RAG Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
